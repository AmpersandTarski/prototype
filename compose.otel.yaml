# Overlay that enables OpenTelemetry tracing in the dev stack and adds a Jaeger
# trace viewer (Jaeger speaks OTLP natively, so no separate collector is needed).
#
#   docker compose -f compose.yaml -f compose.otel.yaml up -d
#
# Traces appear in the Jaeger UI on http://localhost:16686
# See docs/guides/measuring-performance-with-opentelemetry.md

services:
  prototype:
    environment:
      - OTEL_SDK_DISABLED=false
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318

  jaeger:
    container_name: jaeger
    image: jaegertracing/jaeger:2.4.0
    restart: unless-stopped
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - prototype
